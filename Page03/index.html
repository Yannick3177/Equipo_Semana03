<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda de Plantas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          screens: {
            sm: '480px',
            md: '900px',
            lg: '1200px',
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-black font-['Lora',ui-serif,Georgia,serif]">
    <div
      class="bg-[#6b6b3a] text-white flex flex-col sm:flex-row items-center justify-center gap-2 py-2 px-4 text-xs sm:text-sm"
    >
      <span>-15% en la primera compra</span>
      <button
        class="border border-white rounded px-3 py-1 text-xs hover:bg-white hover:text-[#6b6b3a] transition-colors"
      >
        Registrarse
      </button>
    </div>
    <nav
      class="bg-black text-white px-4 sm:px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4"
    >
      <div
        class="flex items-center gap-1 border border-white/30 rounded-full p-1 flex-wrap justify-center"
      >
        <a href="#" class="bg-orange-600 text-white text-sm px-4 py-2 rounded-full">Plantas</a>
        <a href="#" class="text-sm px-4 py-2 rounded-full hover:bg-white/10 transition-colors"
          >Macetas</a
        >
        <a href="#" class="text-sm px-4 py-2 rounded-full hover:bg-white/10 transition-colors"
          >Oferta</a
        >
        <a href="#" class="text-sm px-4 py-2 rounded-full hover:bg-white/10 transition-colors"
          >Suscripciones</a
        >
        <a href="#" class="text-sm px-4 py-2 rounded-full hover:bg-white/10 transition-colors"
          >Cuidado</a
        >
      </div>

      <div class="flex items-center gap-4 sm:gap-6">
        <button
          class="flex items-center gap-2 border border-white/60 rounded-full pl-1 pr-4 py-1 text-sm hover:bg-white/10 transition-colors"
        >
          <span class="w-6 h-6 rounded-full bg-white flex items-center justify-center">
            <i class="fa-solid fa-user text-black text-[10px]"></i>
          </span>
          Entrar
        </button>
        <i class="fa-solid fa-magnifying-glass cursor-pointer"></i>
        <div class="flex items-center gap-2 cursor-pointer text-sm">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>Carrito 0</span>
        </div>
      </div>
    </nav>
    <section
      class="bg-black text-white px-4 sm:px-8 pt-16 pb-24 md:pt-24 md:pb-32 lg:pt-28 lg:pb-36"
    >
      <h1 class="font-title text-5xl sm:text-6xl md:text-7xl lg:text-8xl">Plantas</h1>
    </section>
  </body>
</html>
